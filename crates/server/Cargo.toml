[package]
name = "nexus-server"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Reference Nexus origin server (NXP over TCP)"

[[bin]]
name = "nexus-server"
path = "src/main.rs"

[lib]
name = "nexus_server"
path = "src/lib.rs"

[dependencies]
nexus-protocol = { path = "../protocol" }
nexus-transport = { path = "../transport" }
nexus-content = { path = "../content" }
thiserror = "1"

[lints]
workspace = true
