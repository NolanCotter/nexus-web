[package]
name = "nexus-server"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Reference Nexus origin server (NXP over TCP)"

[[bin]]
name = "nexus-server"
path = "src/main.rs"

[lib]
name = "nexus_server"
path = "src/lib.rs"

[dependencies]
nexus-protocol = { path = "../protocol" }
nexus-transport = { path = "../transport" }
nexus-content = { path = "../content" }
nexus-storage = { path = "../storage" }
nexus-resolver = { path = "../resolver" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"
