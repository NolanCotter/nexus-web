[package]
name = "nexus-identity"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Ed25519 site identities and signed resource records"

[lib]
name = "nexus_identity"
path = "src/lib.rs"

[dependencies]
ed25519-dalek = { version = "2", features = ["rand_core"] }
rand = "0.8"
hex = "0.4"
serde = { version = "1", features = ["derive"] }
thiserror = "1"

[lints]
workspace = true
