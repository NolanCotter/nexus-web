[package]
name = "nexus-storage"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Content-addressed immutable store"

[lib]
name = "nexus_storage"
path = "src/lib.rs"

[dependencies]
blake3 = "1"
hex = "0.4"
thiserror = "1"
[dev-dependencies]
# Replication integration tests: node B serves an imported page over real NXP/TCP.
# (server is not used: it already depends on storage, which would form a cycle.)
nexus-content = { path = "../content" }
nexus-protocol = { path = "../protocol" }
nexus-transport = { path = "../transport" }

[lints]
workspace = true
