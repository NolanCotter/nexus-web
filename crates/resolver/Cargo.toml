[package]
name = "nexus-resolver"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Name -> identity -> records -> nodes resolution abstraction"

[lib]
name = "nexus_resolver"
path = "src/lib.rs"

[dependencies]
thiserror = "1"
nexus-protocol = { path = "../protocol" }
nexus-transport = { path = "../transport" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
hex = "0.4"
ed25519-dalek = { version = "2", features = ["rand_core"] }
nexus-identity = { path = "../identity" }

[lints]
workspace = true
